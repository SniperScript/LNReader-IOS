name: Build iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  NODE_ENV: 'production'

jobs:
  build-ios:
    name: Build iOS / iPad IPA
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Set Up pnpm
        uses: pnpm/action-setup@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Production Dependencies
        run: |
          npm pkg delete dependencies.expo-dev-client
          pnpm install --no-frozen-lockfile
          # Fix Swift 6 type ambiguity in ExpoModulesJSI Date
          find node_modules -name "JavaScriptCodable+Date.swift" -exec sed -i '' 's/abs(milliseconds) <= [^ ]*/(abs(milliseconds) as Double) <= 8640000000000000.0/g' {} + || true
          # Normalize Package.swift files for Xcode 16 Swift compatibility
          python3 -c "
          import glob, re
          for p in glob.glob('node_modules/**/Package.swift', recursive=True):
              with open(p, 'r') as f:
                  s = f.read()
              s = s.replace('// swift-tools-version: 6.2', '// swift-tools-version: 6.0')
              s = re.sub(r',(\s*[\]\)])', r'\1', s)
              with open(p, 'w') as f:
                  f.write(s)
          " || true

      - name: Configure Release Environment
        env:
          MYANIMELIST_CLIENT_ID: ${{ vars.MYANIMELIST_CLIENT_ID }}
          ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
        run: node scripts/generate-env-file.cjs --build-type Release

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS App
        working-directory: ios
        run: |
          xcodebuild \
            -workspace LNReader.xcworkspace \
            -scheme LNReader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p build_output/Payload
          APP_PATH=$(find ios/build -name "LNReader.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: LNReader.app not found in ios/build"
            find ios/build -maxdepth 5
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build_output/Payload/
          cd build_output
          zip -r -q LNReader-iOS.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LNReader-iOS-IPA
          path: build_output/LNReader-iOS.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.1.4-ios' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'LNReader iOS & iPadOS v2.1.4' }}
          body: |
            ## 📱 LNReader for iOS & iPadOS

            ### 🚀 Installation:
            1. Download `LNReader-iOS.ipa` below.
            2. Install on your iPad or iPhone using **AltStore**, **SideStore**, **Sideloadly**, or **TrollStore**.
            3. Enjoy full iPad & iPhone light novel reading with the exact same UI, native Files app integration, and background audio TTS!
          files: build_output/LNReader-iOS.ipa

